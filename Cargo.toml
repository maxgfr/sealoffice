[workspace]
resolver = "3"
members = ["crates/seal-crypto"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# scrypt is unbearably slow unoptimised; keep tests fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
